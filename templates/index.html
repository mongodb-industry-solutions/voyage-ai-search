<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voyage AI Search Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .container {
            padding-left: 0;
            padding-right: 0;
        }
    </style>
</head>
<body>
    <div class="container mt-5" style="display: flex; gap: 1.5rem; width: 100%;">
        <div style="flex: 0 0 40%; display: flex; flex-direction: column;">
            <h1>Voyage AI Search</h1>
            <div class="mt-4 mb-3">
                <div class="btn-group btn-group-sm w-100" role="group">
                    <button type="button" class="btn btn-outline-secondary active" data-type="charts">
                        Charts
                    </button>
                    <button type="button" class="btn btn-outline-secondary" data-type="print">
                        Print
                    </button>
                    <button type="button" class="btn btn-outline-secondary" data-type="podcast">
                        Podcast
                    </button>
                </div>
            </div>
            <div id="chat-box" class="mt-4" style="flex-grow: 1; overflow-y: auto;">
                <!-- Chat messages will appear here -->
            </div>
            <form id="chat-form" class="mt-3">
                <div class="form-group">
                    <input type="text" id="message-input" class="form-control"
                           placeholder="Type your message..." autocomplete="off" required>
                </div>
                <button type="submit" class="btn btn-primary"
		                style="background-color: #b5ddb5; border-color: #b5ddb5; color: #333; font-weight: bold">
                    Send
                </button>
                <div id="examples-container" class="mt-3">
                    <!-- Dynamic content loaded by JS -->
                </div>
            </form>
        </div>
        <div id="sidebar" style="flex: 0 0 60%; padding: 1rem; border-left: 1px solid #ddd;">
            <h2 style="font-size: 1.4rem; color: #444;">Results Panel</h2>
            <p style="color: #666;">This space is used to show results from your queries.</p>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
